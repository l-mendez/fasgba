name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: No time-based revalidate
        # A numeric revalidate exhausted Vercel's ISR-write quota (AGENTS.md → Caching).
        run: |
          if grep -rnE "revalidate\s*[:=]\s*[0-9]" app lib components; then
            echo "::error::Use revalidate = false plus lib/cache invalidators, never a number."
            exit 1
          fi

      - name: Type Check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for vulnerabilities
        run: pnpm audit --audit-level=critical

  db-types:
    name: DB Types Up To Date
    runs-on: ubuntu-latest
    # Regenerates lib/database.types.ts from the *remote* (production) schema and
    # fails if it differs from the committed file. Remote is the source of truth
    # because migrations are applied by hand: a PR adding an unapplied migration
    # passes, and once it is applied this fails until `pnpm run db:types` output is
    # committed. Skips when the secret is unavailable (forks, Dependabot).
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Skip without SUPABASE_ACCESS_TOKEN
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::notice::SUPABASE_ACCESS_TOKEN is not available; skipping the DB types drift check."

      - uses: actions/checkout@v7
        if: env.SUPABASE_ACCESS_TOKEN != ''

      - uses: supabase/setup-cli@v3
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: 3.x

      - name: Compare generated types
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase gen types typescript --project-id uxtfxazbikfqcnnmhufh --schema public > lib/database.types.ts
          if ! git diff --exit-code -- lib/database.types.ts; then
            echo "::error file=lib/database.types.ts::Out of date with the remote schema. Run pnpm run db:types and commit the result."
            exit 1
          fi
